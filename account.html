<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的账号 · 日更复盘</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="disc-bar" id="disc-bar"></div>
<div class="wrap">
  <nav class="nav" id="site-nav"></nav>
  <div class="card">
    <h2>会员状态 / 兑换开通</h2>
    <div id="acc-status"></div>
    <h3>兑换码开通</h3>
    <p class="muted tiny">粘贴运营发给你的兑换码，完成本地开通。</p>
    <div class="field"><label>兑换码</label><input id="acc-code" placeholder="粘贴运营发给你的码"></div>
    <div class="row-actions">
      <button class="btn primary" type="button" id="acc-redeem">兑换开通</button>
      <a class="btn" href="pay.html">去支付页</a>
    </div>
    <p class="tiny" id="acc-msg"></p>
  </div>
  <div class="card">
    <h2>本地订单</h2>
    <div id="acc-orders"></div>
  </div>
  <footer class="footer" id="site-footer"></footer>
</div>
<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/account.js"></script>
<script>XGAccount.init();</script>
<script>
XGCommon.renderChrome('account');
XGCommon.gateDisclaimer();
</script>
</body>
</html>
